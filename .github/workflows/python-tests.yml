name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run tests
        run: |
          if [ -n "$ARIA_CONNECTION_USERNAME" ] \
            && [ -n "$ARIA_CONNECTION_PASSWORD" ] \
            && [ -n "$ARIA_CONNECTION_LOGIN_URL" ] \
            && [ -n "$ARIA_CONNECTION_GRANT_TYPE" ] \
            && [ -n "$ARIA_CONNECTION_SCOPE" ] \
            && [ -n "$ARIA_GQL_TEST" ] \
            && [ -n "$ARIA_REST_TEST" ] \
            && [ -n "$ARIA_CLIENT_ID" ] \
            && [ -n "$ARIA_CLIENT_SECRET" ] \
            && [ -n "$ARIA_CONNECTION_REFRESH_GRANT" ] \
            && [ -n "$TEST_VISIT_ID" ] \
            && [ -n "$TEST_RECORD_ID" ]; then
            export ARIA_RUN_TESTS=1
          else
            echo "Skipping ARIA integration tests because required secrets are unavailable."
          fi
          python -m pytest
        env:
          ARIA_CONNECTION_USERNAME: ${{ secrets.ARIA_CONNECTION_USERNAME }}
          ARIA_CONNECTION_PASSWORD: ${{ secrets.ARIA_CONNECTION_PASSWORD }}
          ARIA_CONNECTION_LOGIN_URL: ${{ secrets.ARIA_CONNECTION_LOGIN_URL }}
          ARIA_CONNECTION_GRANT_TYPE: ${{ secrets.ARIA_CONNECTION_GRANT_TYPE }}
          ARIA_CONNECTION_SCOPE: ${{ secrets.ARIA_CONNECTION_SCOPE }}
          ARIA_GQL_TEST: ${{ secrets.ARIA_GQL_TEST }}
          ARIA_REST_TEST: ${{ secrets.ARIA_REST_TEST }}
          ARIA_CLIENT_ID: ${{ secrets.ARIA_CLIENT_ID }}
          ARIA_CLIENT_SECRET: ${{ secrets.ARIA_CLIENT_SECRET }}
          ARIA_CONNECTION_REFRESH_GRANT: ${{ secrets.ARIA_CONNECTION_REFRESH_GRANT }}
          DEV: "TEST"
          TEST_VISIT_ID: ${{ secrets.TEST_VISIT_ID }}
          TEST_RECORD_ID: ${{ secrets.TEST_RECORD_ID }}
